[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retro-eval"
version = "0.1.0"
description = "CLI research toolkit for comparing retrosynthesis-prediction approaches (local HF models, Ollama-served chat models, Qdrant RAG + Groq) on a CPU-only laptop."
readme = "README.MD"
requires-python = ">=3.10"
dependencies = [
    "groq",
    "numpy",
    "openai",
    "qdrant-client",
    "rdkit",
]

[project.optional-dependencies]
indexing = [
    "datasets",
    "huggingface_hub",
    "ord-schema",
    "tqdm",
]
local-models = [
    "torch",
    "transformers",
    "peft",
    "accelerate",
    "bitsandbytes",
    "sentencepiece",
    "llama-cpp-python",
]
eval-runner = [
    "tenacity",
    "tqdm",
]
test = [
    "pytest",
]

[tool.setuptools.packages.find]
where = ["src"]
